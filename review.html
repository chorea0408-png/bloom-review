<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLOOM 검토 페이지</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='28' fill='%2323856e'/%3E%3Cg transform='translate(38 24) scale(0.42)'%3E%3Cpath d='M7 7 L19 7 C36 7 45 19 45 36 L45 63 C34 75 30 89 25 103 C21 114 14 119 7 119 Z' fill='white'/%3E%3Cpath d='M28 119 C36 106 39 83 52 69 C63 56 80 53 103 53 C100 87 89 108 67 116 C58 119 45 119 28 119 Z' fill='white'/%3E%3C/g%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --green:#23856e;--green-dark:#176b59;--green-soft:#eaf5f1;
  --ink:#23312d;--muted:#7f8984;--line:#e7eae7;--canvas:#f4f6f3;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--canvas);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;}

/* 상단 바 */
.topbar{background:var(--green);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;}
.topbar-logo{display:flex;align-items:center;gap:8px;}
.topbar-logo svg{width:20px;height:23px;}
.topbar-name{font-size:13px;font-weight:800;letter-spacing:.1em;}
.topbar-sub{font-size:11px;opacity:.7;margin-left:2px;}
.topbar-label{margin-left:auto;background:rgba(255,255,255,.15);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;}

/* 로딩/에러 */
.state{max-width:600px;margin:80px auto;text-align:center;padding:0 20px;}
.state h2{font-size:22px;margin-bottom:10px;color:var(--ink);}
.state p{color:var(--muted);font-size:14px;}
.spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* 메인 레이아웃 */
.layout{max-width:900px;margin:0 auto;padding:24px 16px 60px;display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start;}
@media(max-width:768px){.layout{grid-template-columns:1fr;}}

/* 원고 영역 */
.article-wrap{background:#fff;border-radius:16px;border:1px solid var(--line);overflow:hidden;box-shadow:0 4px 24px rgba(36,52,45,.07);}
.article-header{background:var(--green);color:#fff;padding:20px 24px;}
.article-header .ah-label{font-size:11px;opacity:.7;letter-spacing:.08em;margin-bottom:4px;}
.article-header h1{font-size:20px;font-weight:800;line-height:1.3;}
.article-body{padding:28px 24px;}
/* 원고 내용 스타일 */
.article-body h2{font-size:18px;font-weight:700;margin:24px 0 10px;color:var(--ink);}
.article-body p{margin:0 0 14px;font-size:15px;color:#33433e;}
.article-body blockquote{border-left:3px solid var(--green);margin:16px 0;padding:10px 16px;background:var(--green-soft);border-radius:0 8px 8px 0;font-style:italic;color:#3a5a50;}
.article-body ul,.article-body ol{margin:10px 0 14px 20px;}
.article-body li{margin-bottom:6px;font-size:15px;}
.article-body img{max-width:100%;border-radius:8px;margin:10px 0;}
.article-body .place-card{background:#f0f5f0;border:1px solid #d0e0d0;border-radius:10px;padding:12px 14px;margin:12px 0;font-size:13px;color:#4a6a5a;}
.article-body .tag-block{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0;}
.article-body .tag{background:var(--green-soft);color:var(--green);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;}
.article-body table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px;}
.article-body th{background:var(--green-soft);padding:8px 12px;text-align:left;border:1px solid var(--line);}
.article-body td{padding:8px 12px;border:1px solid var(--line);}
.photo-placeholder{background:#f0f4f0;border:2px dashed #c0d0c0;border-radius:8px;padding:20px;text-align:center;color:#8a9a8a;font-size:13px;margin:12px 0;}

/* 의견 패널 */
.comment-panel{display:flex;flex-direction:column;gap:16px;}
.comment-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(36,52,45,.05);}
.comment-card h3{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--green);}
.comment-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;max-height:360px;overflow-y:auto;}
.comment-item{background:var(--canvas);border-radius:10px;padding:12px 14px;}
.comment-item .c-author{font-size:12px;font-weight:700;color:var(--green);margin-bottom:4px;}
.comment-item .c-date{font-size:11px;color:var(--muted);float:right;}
.comment-item .c-text{font-size:13px;color:var(--ink);line-height:1.5;}
.no-comments{text-align:center;color:var(--muted);font-size:13px;padding:20px 0;}
.comment-form{display:flex;flex-direction:column;gap:8px;}
.comment-form input,.comment-form textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;
  padding:9px 12px;font-size:13px;font-family:inherit;
  background:#fafcfa;color:var(--ink);
  transition:.15s;outline:none;
}
.comment-form input:focus,.comment-form textarea:focus{border-color:var(--green);background:#fff;}
.comment-form textarea{resize:vertical;min-height:80px;}
.comment-form button{
  background:var(--green);color:#fff;border:none;border-radius:8px;
  padding:10px;font-size:13px;font-weight:700;cursor:pointer;
  transition:.15s;font-family:inherit;
}
.comment-form button:hover{background:var(--green-dark);}
.comment-form button:disabled{opacity:.5;cursor:not-allowed;}
.submit-msg{font-size:12px;color:var(--green);font-weight:600;text-align:center;min-height:16px;}

/* 만료/비활성 배너 */
.expired-banner{background:#fff3cd;border:1px solid #f0d080;border-radius:10px;padding:14px 16px;font-size:13px;color:#7a6020;text-align:center;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">
    <svg viewBox="0 0 110 126" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M7 7 L19 7 C36 7 45 19 45 36 L45 63 C34 75 30 89 25 103 C21 114 14 119 7 119 Z" fill="white"/>
      <path d="M28 119 C36 106 39 83 52 69 C63 56 80 53 103 53 C100 87 89 108 67 116 C58 119 45 119 28 119 Z" fill="white"/>
    </svg>
    <span class="topbar-name">BLOOM</span><span class="topbar-sub">BLOG SHOWROOM</span>
  </div>
  <span class="topbar-label" id="reviewLabel">검토 페이지</span>
</div>

<div id="loadingState" class="state">
  <div class="spinner"></div>
  <h2>검토 페이지를 불러오는 중...</h2>
  <p>잠시만 기다려 주세요.</p>
</div>

<div id="errorState" class="state" style="display:none">
  <h2>페이지를 찾을 수 없습니다</h2>
  <p>링크가 만료됐거나 잘못된 주소입니다.<br>보내주신 분께 다시 확인해 주세요.</p>
</div>

<div id="mainLayout" class="layout" style="display:none">
  <div>
    <div class="article-wrap">
      <div class="article-header">
        <div class="ah-label">BLOOM · 블로그 시안</div>
        <h1 id="articleTitle">—</h1>
      </div>
      <div class="article-body" id="articleBody"></div>
    </div>
  </div>
  <div class="comment-panel">
    <div id="expiredBanner" class="expired-banner" style="display:none">
      이 링크는 읽기 전용입니다. 의견을 남길 수 없습니다.
    </div>
    <div class="comment-card">
      <h3>💬 의견 남기기</h3>
      <div class="comment-list" id="commentList">
        <div class="no-comments">아직 의견이 없습니다.</div>
      </div>
      <div class="comment-form" id="commentForm">
        <input type="text" id="authorInput" placeholder="이름 (예: 홍길동 팀장)" maxlength="30">
        <textarea id="contentInput" placeholder="의견을 입력해 주세요..." maxlength="500"></textarea>
        <button id="submitBtn" onclick="submitComment()">의견 보내기</button>
        <div class="submit-msg" id="submitMsg"></div>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://bjniwdmlzwjvqdcnqrfo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0hZNYAbSXoUXhgHuHlrNZA_zW1Q53Mw';

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentToken = null;
let reviewActive = true;

function getToken() {
  const p = new URLSearchParams(location.search);
  return p.get('t') || p.get('token');
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('ko-KR', {month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

async function loadReview() {
  const token = getToken();
  if (!token) { showError(); return; }
  currentToken = token;

  const { data, error } = await db
    .from('bloom_reviews')
    .select('*')
    .eq('token', token)
    .single();

  if (error || !data) { showError(); return; }

  // 만료 체크
  if (data.expires_at && new Date(data.expires_at) < new Date()) {
    reviewActive = false;
  }
  if (!data.is_active) reviewActive = false;

  document.getElementById('articleTitle').textContent = data.title || '블로그 원고';
  document.getElementById('articleBody').innerHTML = data.html_content || '';
  document.getElementById('reviewLabel').textContent = '검토 페이지 · ' + (data.title || '').slice(0, 18);
  document.title = (data.title || '검토') + ' — BLOOM';

  if (!reviewActive) {
    document.getElementById('expiredBanner').style.display = 'block';
    document.getElementById('commentForm').style.display = 'none';
  }

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('mainLayout').style.display = 'grid';

  await loadComments();
  // 10초마다 댓글 새로고침
  setInterval(loadComments, 10000);
}

async function loadComments() {
  const { data } = await db
    .from('bloom_comments')
    .select('*')
    .eq('review_token', currentToken)
    .order('created_at', { ascending: true });

  const list = document.getElementById('commentList');
  if (!data || data.length === 0) {
    list.innerHTML = '<div class="no-comments">아직 의견이 없습니다.</div>';
    return;
  }
  list.innerHTML = data.map(c => `
    <div class="comment-item">
      <span class="c-date">${formatDate(c.created_at)}</span>
      <div class="c-author">${esc(c.author_name)}</div>
      <div class="c-text">${esc(c.content).replace(/\n/g,'<br>')}</div>
    </div>
  `).join('');
  list.scrollTop = list.scrollHeight;
}

async function submitComment() {
  if (!reviewActive) return;
  const author = document.getElementById('authorInput').value.trim();
  const content = document.getElementById('contentInput').value.trim();
  const msg = document.getElementById('submitMsg');
  const btn = document.getElementById('submitBtn');

  if (!author) { msg.textContent = '이름을 입력해 주세요.'; msg.style.color='#c05050'; return; }
  if (!content) { msg.textContent = '의견을 입력해 주세요.'; msg.style.color='#c05050'; return; }

  btn.disabled = true;
  msg.textContent = '전송 중...'; msg.style.color='var(--muted)';

  const { error } = await db.from('bloom_comments').insert({
    review_token: currentToken,
    author_name: author,
    content: content,
  });

  if (error) {
    msg.textContent = '전송에 실패했습니다. 다시 시도해 주세요.';
    msg.style.color = '#c05050';
  } else {
    document.getElementById('contentInput').value = '';
    msg.textContent = '의견이 전달됐습니다!';
    msg.style.color = 'var(--green)';
    await loadComments();
  }
  btn.disabled = false;
  setTimeout(() => { msg.textContent = ''; }, 3000);
}

function showError() {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('errorState').style.display = 'block';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadReview();
</script>
</body>
</html>
